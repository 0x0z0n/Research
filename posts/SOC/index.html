<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOC Knowledge Base</title>
<meta name="description" content="A searchable knowledge base of SOC runbooks, KQL queries, MITRE ATT&CK mappings and reference material.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="console">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-brand">
      <span class="dot"></span>
      <span class="brand-text">SOC<span class="brand-sub">::knowledge-base</span></span>
    </div>
    <div class="topbar-search">
      <input id="search" type="text" placeholder="grep --title ...  (press / to focus)" autocomplete="off">
    </div>
    <div class="topbar-meta">
      <span id="doc-count">0 docs</span>
    </div>
  </header>

  <div class="body">

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar" aria-label="Document categories">
      <!-- populated by app.js -->
    </nav>

    <!-- Main content -->
    <main class="content" id="content">
      <div class="welcome" id="welcome">
        <p class="prompt-line"><span class="prompt-user">analyst@soc-kb</span>:<span class="prompt-path">~</span>$ <span class="cursor">▌</span></p>
        <h1>SOC Knowledge Base</h1>
        <p class="lede">Runbooks, KQL queries, MITRE ATT&amp;CK mappings, and reference material for security operations. Pick a document from the left, or search above.</p>
        <div class="welcome-grid" id="welcome-grid"><!-- category cards, populated by app.js --></div>
      </div>

      <article class="doc" id="doc" hidden>
        <div class="doc-header">
          <span class="doc-tag" id="doc-tag">GEN</span>
          <h2 id="doc-title">Untitled</h2>
          <a class="doc-raw" id="doc-raw" href="#" target="_blank" rel="noopener">view raw</a>
        </div>
        <div class="doc-body" id="doc-body"><!-- rendered markdown / code, populated by app.js --></div>
      </article>
    </main>

  </div>

  <!-- Status bar -->
  <footer class="statusbar">
    <span id="status-left">root@soc-kb:~$ ready</span>
    <span id="status-right">last sync: <span id="sync-date">—</span></span>
  </footer>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
