<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropVision - Tomato Disease Prediction</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <style>
    /* Root colors */
    :root {
        --primary: #4CAF50;   /* Fresh green */
        --secondary: #A8D5BA; /* Soft green */
        --bg: #F0FAF0;        /* Light green background */
        --card-bg: #ffffff;    /* Card white */
        --text: #333333;
        --shadow: rgba(0,0,0,0.1);
    }

    /* Page styling */
    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Card container */
    .container {
        max-width: 450px;
        margin: 2rem auto;
        padding: 2rem;
        background: var(--card-bg);
        border-radius: 20px;
        box-shadow: 0 8px 20px var(--shadow);
        text-align: center;
    }

    /* Heading */
    h2 {
        color: var(--primary);
        margin-bottom: 1.5rem;
        font-weight: 600;
    }

    /* Upload label */
    .upload-label {
        display: inline-block;
        padding: 12px 30px;
        background: var(--primary);
        color: #fff;
        font-size: 1em;
        font-weight: 500;
        text-align: center;
        border-radius: 8px;
        transition: all 0.3s ease;
        cursor: pointer;
        margin-bottom: 1rem;
    }
    .upload-label:hover {
        background: var(--secondary);
        color: var(--text);
        transform: translateY(-2px);
    }

    /* Hide default file input */
    input[type="file"] {
        display: none;
    }

    /* Image preview */
    .img-preview {
        width: 256px;
        height: 256px;
        margin: 1em auto;
        border: 3px solid var(--secondary);
        border-radius: 15px;
        box-shadow: 0 5px 15px var(--shadow);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #EAF5EA;
    }
    .img-preview > div {
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    /* Predict button */
    #btn-predict {
        margin-top: 1rem;
        padding: 10px 25px;
        background: var(--primary);
        border: none;
        border-radius: 8px;
        color: #fff;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    #btn-predict:hover {
        background: var(--secondary);
        color: var(--text);
        transform: translateY(-2px);
    }

    /* Loader spinner */
    .loader {
        border: 6px solid #f3f3f3;
        border-top: 6px solid var(--primary);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        margin: 1rem auto;
        display: none;
        animation: spin 1s linear infinite;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* Result text */
    #result {
        margin-top: 1.5rem;
        font-size: 1.2rem;
        font-weight: 500;
        color: var(--primary);
        display: none;
    }
    </style>
</head>
<body>

<div class="container">
    <h2>CropVision - Tomato Classifier</h2>

    <form id="upload-file" method="post" enctype="multipart/form-data">
        <label for="imageUpload" class="upload-label">Choose Image</label>
        <input type="file" name="file" id="imageUpload" accept=".png, .jpg, .jpeg">
    </form>

    <div class="image-section" style="display:none;">
        <div class="img-preview">
            <div id="imagePreview"></div>
        </div>
        <button type="button" class="btn" id="btn-predict">Predict!</button>
    </div>

    <div class="loader" id="loader"></div>
    <h3 id="result"></h3>
</div>

<script>
$(document).ready(function () {
    const fileInput = document.getElementById('imageUpload');
    const previewDiv = document.getElementById('imagePreview');
    const imageSection = $('.image-section');
    const loader = $('#loader');
    const resultDisplay = $('#result');
    const predictBtn = $('#btn-predict');

    // Handle Image Selection and Preview
    fileInput.addEventListener('change', function() {
        const file = this.files[0];
        if (!file) return;

        // Reset UI
        resultDisplay.hide().text('');
        imageSection.hide();
        predictBtn.show();

        const reader = new FileReader();
        reader.onload = function(e) {
            previewDiv.style.backgroundImage = `url('${e.target.result}')`;
            imageSection.fadeIn(650);
        }
        reader.readAsDataURL(file);
    });

    // Handle Predict Button Click
    predictBtn.click(function (e) {
        // Stop the form from reloading the page
        e.preventDefault();

        // Prepare the image data
        var form_data = new FormData($('#upload-file')[0]);

        // UI Changes: Hide button, show loader
        $(this).hide();
        loader.show();
        resultDisplay.hide();

        // AJAX Call to Flask /predict route
        $.ajax({
            type: 'POST',
            url: '/predict',
            data: form_data,
            contentType: false,
            cache: false,
            processData: false,
            async: true,
            success: function (data) {
                // Success! Hide loader and show result
                loader.hide();
                resultDisplay.fadeIn(600);
                resultDisplay.text('Diagnosis: ' + data);
                console.log('Prediction Success: ' + data);
            },
            error: function (xhr, status, error) {
                // Error handling
                loader.hide();
                predictBtn.show();
                resultDisplay.fadeIn(600);
                resultDisplay.css('color', 'red').text('Error: Could not reach server.');
                console.error("Server Error Output:", xhr.responseText);
            }
        });
    });
});
</script>

</body>
</html>
