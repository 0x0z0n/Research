<VirtualHost *:80>
    ServerName localhost
    Redirect permanent / http://wingdata.htb/
</VirtualHost>

<VirtualHost *:80>
    ServerName wingdata.htb
    DocumentRoot /var/www/wingdata.htb

    <Directory /var/www/wingdata.htb>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/wingdata_error.log
    CustomLog ${APACHE_LOG_DIR}/wingdata_access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName ftp.wingdata.htb

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Opcional: seguridad básica
    <Location "/">
        Require all granted
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/ftp.wingdata_proxy_error.log
    CustomLog ${APACHE_LOG_DIR}/ftp.wingdata_proxy_access.log combined
</VirtualHost>
